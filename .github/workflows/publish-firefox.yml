name: Publish Firefox Add-on

on:
  workflow_dispatch:
  push:
    tags:
      - "firefox-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Build Firefox package
        id: package
        shell: pwsh
        run: ./scripts/package-firefox.ps1

      - name: Upload unsigned Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: firefox-package
          path: |
            dist/visual-tab-manager-firefox.zip
            dist/firefox/**

      - name: Install web-ext
        if: startsWith(github.ref, 'refs/tags/firefox-v') && secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != ''
        run: npm install --global web-ext

      - name: Publish listed add-on to AMO
        if: startsWith(github.ref, 'refs/tags/firefox-v') && secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != ''
        shell: bash
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail

          META_FILE="release/amo/metadata.json"

          if [[ -f "$META_FILE" ]]; then
            web-ext sign \
              --channel listed \
              --source-dir dist/firefox \
              --artifacts-dir web-ext-artifacts \
              --amo-metadata "$META_FILE" \
              --api-key "$AMO_JWT_ISSUER" \
              --api-secret "$AMO_JWT_SECRET"
          else
            web-ext sign \
              --channel listed \
              --source-dir dist/firefox \
              --artifacts-dir web-ext-artifacts \
              --api-key "$AMO_JWT_ISSUER" \
              --api-secret "$AMO_JWT_SECRET"
          fi

      - name: Skip AMO publish when secrets are unavailable
        if: startsWith(github.ref, 'refs/tags/firefox-v') && (secrets.AMO_JWT_ISSUER == '' || secrets.AMO_JWT_SECRET == '')
        shell: bash
        run: echo "Skipping AMO publish because AMO_JWT_ISSUER or AMO_JWT_SECRET is not configured."

      - name: Upload signed AMO artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-signed-artifacts
          path: web-ext-artifacts/**
          if-no-files-found: ignore
